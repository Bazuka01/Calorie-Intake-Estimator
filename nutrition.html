<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nutrition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header> 
        <h1>Nutrition</h1>
        <nav class ="navbar">
            <a href="index.html">Home</a>
            <a href="nutrition.html">Nutrition</a>
            <a href="history.html">History</a>

        </nav>
        <div class="theme-switch">
    <span>🌙</span>

    <label class="switch">
        <input type="checkbox" id="theme-toggle">
        <span class="slider"></span>
    </label>

    <span>☀️</span>
</div>
    </header>
    <main>

<section class="nutrition-section">

    <h2>Nutrition Finder</h2>

    <p class="nutrition-description">
        Search foods that match your nutrition goals.
    </p>

    <div class="goal-card">

        <h3>Your Daily Calorie Goal</h3>

        <p id="daily-calories">
            --
        </p>

    </div>

<div class="recommendation-section">

    <h2>Recommended For You</h2>

    <p id="recommendation-description">
        Based on your goal
    </p>

    <div id="recommendation-list">

    </div>

</div>

    <div class="search-section">

        <input
            type="text"
            id="food-search"
            placeholder="Search for a food..."
        >

        <button id="search-button">
            Search
        </button>

    </div>

    <div class="filter-buttons">

        <button id="high-protein-filter">
            High Protein
        </button>

        <button id="low-carb-filter">
            Low Carb
        </button>

        <button id="low-fat-filter">
            Low Fat
        </button>

    </div>

    <div id="food-results">

    </div>

</section>

</main>
    <footer>

    <p>&copy; 2026 Calorie Intake Estimator. All rights reserved.</p>
</footer>

    <script src="nutrition.js"></script>

</body>
</html>
